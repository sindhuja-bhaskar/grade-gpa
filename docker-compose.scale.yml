# DA3 Q1 — three backend replicas behind an Nginx load balancer, all connected
# to the existing cloud PostgreSQL (Prisma Postgres) from Assignment 1.
#
#   docker compose -f docker-compose.scale.yml up -d --build
#   NGINX_CONF=lb-1.conf docker compose -f docker-compose.scale.yml up -d   # 1 replica
#
# DATABASE_URL and AUTH_SECRET are read from .env at run time and never baked
# into the image. Every replica shares AUTH_SECRET and the same session table,
# so a student signed in through one replica is signed in on all of them: the
# application tier holds no state of its own.

x-backend: &backend
  image: gradegpa:hardened
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    DATABASE_URL: ${DATABASE_URL}
    AUTH_SECRET: ${AUTH_SECRET}
    SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
    DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}

services:
  backend1:
    <<: *backend
    container_name: gradegpa-backend-1
    hostname: backend1
    ports: ["3001:3000"]

  backend2:
    <<: *backend
    container_name: gradegpa-backend-2
    hostname: backend2
    ports: ["3002:3000"]

  backend3:
    <<: *backend
    container_name: gradegpa-backend-3
    hostname: backend3
    ports: ["3003:3000"]

  nginx:
    image: nginx:1.27-alpine
    container_name: gradegpa-nginx
    restart: unless-stopped
    ports: ["8080:80"]
    volumes:
      - ./deploy/nginx/log-format.conf:/etc/nginx/conf.d/00-log-format.conf:ro
      - ./deploy/nginx/${NGINX_CONF:-lb-3.conf}:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend1, backend2, backend3]
