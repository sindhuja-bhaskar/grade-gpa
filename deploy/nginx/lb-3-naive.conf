# DA3 Q1(c) "before" — plain round-robin with no failover. A request routed to a
# stopped replica is returned to the client as an error instead of retried.
# Kept only to reproduce the before/after measurement; lb-3.conf is the fix.

upstream gradegpa_backend {
    zone gradegpa_backend 64k;
    server backend1:3000;
    server backend2:3000;
    server backend3:3000;
}

server {
    listen 80;

    location / {
        proxy_pass http://gradegpa_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream off;
        add_header X-Upstream $upstream_addr always;
    }

    access_log /var/log/nginx/access.log upstreamlog;
}
