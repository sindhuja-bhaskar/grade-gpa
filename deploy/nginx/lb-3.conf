# DA3 Q1(c) — three replicas, with failover so that losing one loses no request.
#
# What makes a stopped instance invisible to clients:
#   max_fails/fail_timeout  one failed attempt takes a replica out of rotation
#                           for 10 s instead of sending it every third request;
#   proxy_next_upstream     a request that hit a dead or dying replica (refused
#                           connection, reset, timeout, 502/503/504) is replayed
#                           on the next one before anything reaches the client;
#   proxy_connect_timeout   2 s, not the 60 s default, so a vanished container
#                           costs one short retry, not a hung request.
# POST/PUT/DELETE are deliberately NOT retried (no `non_idempotent`): replaying a
# mark entry on a second replica could apply it twice.

upstream gradegpa_backend {
    # Shared memory zone: without it every worker process keeps its own
    # round-robin pointer and failure count, so a fresh worker starts on
    # backend1 and keeps sending traffic to a replica another worker saw die.
    zone gradegpa_backend 64k;
    server backend1:3000 max_fails=1 fail_timeout=10s;
    server backend2:3000 max_fails=1 fail_timeout=10s;
    server backend3:3000 max_fails=1 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;

    location / {
        proxy_pass http://gradegpa_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # Which replica answered — evidence for Q1(a).
        add_header X-Upstream $upstream_addr always;
    }

    access_log /var/log/nginx/access.log upstreamlog;
}
