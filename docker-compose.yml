# Local PostgreSQL so development and production run the same engine (§32).
services:
  db:
    image: postgres:16-alpine
    container_name: gradegpa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gradegpa
      POSTGRES_PASSWORD: gradegpa
      POSTGRES_DB: gradegpa
    ports:
      - "5432:5432"
    volumes:
      - gradegpa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradegpa -d gradegpa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gradegpa-pgdata:
